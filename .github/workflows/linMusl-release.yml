name: Wintermolt linMusl release binaries

# Builds the musl builds published as prebuilt/wintermolt-linux-<arch>-musl,
# natively inside an alpine:3.23 container.
#
# Why a container, and why Alpine:
#   - The build links the system libcurl and libsqlite3, so it has to run where
#     those are the musl builds. Alpine is that place.
#   - -Dtarget= is deliberately NOT passed. Naming a target makes Zig treat the
#     build as a cross-compile and stop finding libcurl and libsqlite3
#     (build.zig:48). Natively on Alpine the target is already *-linux-musl.
#   - The result links /lib/ld-musl-<arch>.so.1, carries no GLIBC_* imports at
#     all, and runs on Alpine with neither gcompat nor LD_PRELOAD. That is the
#     #2 fix, and the check step fails the lane if a GLIBC_ import ever returns.
#
# Why `docker run` instead of a job-level `container:`:
#   A job-level container runs the runner's glibc Node runtime inside it for
#   JavaScript actions (actions/checkout, upload-artifact), which on Alpine
#   needs libc6-compat, i.e. gcompat. Keeping the job on the host runner and the
#   musl work inside a long-lived `docker run` container means the Alpine
#   container only ever runs shell, and no gcompat enters the picture anywhere.
#
# Alpine 3.23 is the release the #2 reporter ran (Alpine 3.23.6) and the one the
# README's musl section was verified against.
#
# The binary is uploaded as an artifact only. Committing it to prebuilt/ and
# attaching it to a release stays a manual step, after review.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64: the Pi / Alpine case in #2. ubuntu-24.04-arm is the GitHub
          # hosted arm64 runner, available to public repositories.
          - runner: ubuntu-24.04-arm
            arch: arm64
            cpu: baseline
          # x86_64: the same routine on the amd64 Alpine lane.
          - runner: ubuntu-latest
            arch: x86_64
            cpu: x86_64_v3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Start the alpine:3.23 build container
        run: docker run -d --name build -v "$PWD":/w -w /w alpine:3.23 sleep infinity

      - name: Install build and check tools
        run: |
          docker exec build apk add --no-cache \
            build-base curl curl-dev sqlite-dev pkgconf \
            binutils file xz tar

      - name: Install Zig 0.16.0
        run: |
          docker exec -i build sh -s <<'EOS'
          set -eu
          arch=$(uname -m)
          zigdir="/opt/zig-${arch}-linux-0.16.0"
          # The official Linux Zig build is a static binary: it runs on musl.
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/0.16.0/zig-${arch}-linux-0.16.0.tar.xz"
          tar -C /opt -xf /tmp/zig.tar.xz
          ln -sf "$zigdir/zig" /usr/local/bin/zig
          zig version
          EOS

      - name: Build
        run: docker exec build zig build -Doptimize=ReleaseSmall -Dcpu=${{ matrix.cpu }} -Dstrip=true --summary all

      - name: Test
        run: docker exec build zig build test --summary all

      - name: Check the binary
        run: |
          docker exec -i build sh -s <<'EOS'
          set -eu
          B=zig-out/bin/wintermolt
          file "$B"
          ls -l "$B"
          sha256sum "$B"

          if ! readelf -l "$B" | grep -q 'ld-musl-.*\.so\.1'; then
            echo "FAIL: interpreter is not the musl loader"
            exit 1
          fi
          if readelf -V "$B" | grep -q 'GLIBC_'; then
            echo "FAIL: the binary still carries GLIBC_ version needs"
            exit 1
          fi
          if readelf --dyn-syms "$B" | grep -q 'GLIBC_'; then
            echo "FAIL: the binary still imports GLIBC_ symbols"
            exit 1
          fi
          if strings "$B" | grep -q 'GLIBC_'; then
            echo "FAIL: GLIBC_ strings remain in the binary"
            exit 1
          fi
          echo "OK: musl loader, zero GLIBC_ imports"

          echo "DT_NEEDED:"
          readelf -d "$B" | grep NEEDED
          EOS

      - name: Smoke test on musl (no gcompat)
        run: |
          docker exec -i build sh -s <<'EOS'
          set -eu
          B=zig-out/bin/wintermolt
          "$B" --version
          printf '/stats\n/quit\n' | "$B"
          EOS

      - uses: actions/upload-artifact@v4
        with:
          name: wintermolt-linux-${{ matrix.arch }}-musl
          path: zig-out/bin/wintermolt
          retention-days: 14

      - name: Stop the build container
        if: always()
        run: docker rm -f build
